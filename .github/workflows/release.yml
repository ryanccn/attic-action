name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3 or v1.2.3-rc.1)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="v${VERSION#v}"

          if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          {
            echo "tag=$VERSION"
            echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "major=v${BASH_REMATCH[1]}"
            if [ -n "${BASH_REMATCH[4]}" ]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0

      - name: Build
        run: pnpm run build

      - name: Create and push tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          # An empty index keeps the rest of the repository out of the tagged commit
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git add --force action.yml dist/index.js
          tree="$(git write-tree)"
          unset GIT_INDEX_FILE

          commit="$(git commit-tree "$tree" -p HEAD -m "$TAG")"

          git tag "$TAG" "$commit"
          refs=("refs/tags/$TAG")

          if [ "$PRERELEASE" != "true" ]; then
            git tag --force "$MINOR" "$commit"
            git tag --force "$MAJOR" "$commit"
            refs+=("+refs/tags/$MINOR" "+refs/tags/$MAJOR")
          fi

          git push --atomic origin "${refs[@]}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --prerelease="$PRERELEASE"
